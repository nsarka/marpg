[client]
# Face movement after the mouse stays still this many seconds.
mouse_idle_seconds = 1.5
name = "Rick"
# 147.182.213.239
ip = "127.0.0.1"
port = 54000
# 0 = automatic, 1 = red, 2 = blue; further teams use 3-32 (must exist on the server).
team = 0
# Show white damage numbers for combat between other players/bots.
show_other_damage_numbers = true

# Key names are case-insensitive. Use a string or an array of alternatives.
# Use empty brackets e.g. walk = [] or move_up = [] to disable an action.
# Changes apply when the client restarts.
[bindings]
move_up = "W"
move_down = "S"
move_left = "A"
move_right = "D"
walk = ["LShift", "RShift"]
light = "Mouse_Left"
heavy = "Mouse_Right"
scoreboard = "Tab"
debug = "F1"
# Press to ready the spell, then left-click a target. Press again to cancel.
spell = "E"
# Ready lightning, then left-click a location; press again to cancel.
lightning = "Q"

# Local lighting (visual only; does not change spell damage/range).
# Restart the client after editing. Missing settings use built-in defaults.
# radius: world pixels (0 disables when radius_multiplier is also 0).
# intensity: 0-10; height: 1-2000 above the ground.
# red/green/blue: 0-1. enabled=false turns off that light type.
# directionality: 0 = even glow, 1 = fully normal-dependent lighting.
# falloff_exponent: 0.1-8; lower spreads light out, higher concentrates it.
# Spell radius = max(radius, attack radius * radius_multiplier).

[light_player]
enabled = true
radius = 600
intensity = 0.15
height = 80
red = 1
green = 0.9
blue = 0.72
radius_multiplier = 0
directionality = 0.5
falloff_exponent = 2.0

[light_bot]
enabled = false
radius = 600
intensity = 0.4
height = 80
red = 1
green = 0.9
blue = 0.72
radius_multiplier = 0
directionality = 0.5
falloff_exponent = 2.0

